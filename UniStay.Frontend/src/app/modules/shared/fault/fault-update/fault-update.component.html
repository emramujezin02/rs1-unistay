<div class="fault-update-container">

  <mat-card @formAnimation>
    <h2>{{ isEdit ? 'Edit Fault' : 'Add Fault' }}</h2>

    <form [formGroup]="form" (ngSubmit)="saveFault()">

      <mat-form-field appearance="outline" class="full-width" @fieldAnimation>
        <mat-label>Title</mat-label>
        <input matInput formControlName="title">
        <mat-error *ngIf="form.get('title')?.invalid && form.get('title')?.touched">
          Required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width" @fieldAnimation>
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" rows="3"></textarea>
      </mat-form-field>

      <!-- STATUS SELECT -->
      <mat-form-field appearance="outline" class="full-width" @fieldAnimation>
        <mat-label>Status</mat-label>
        <mat-select formControlName="status" panelClass="fault-update-select-panel">
          <mat-option value="Unresolved">Unresolved</mat-option>
          <mat-option value="Resolved">Resolved</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width" @fieldAnimation>
        <mat-label>Priority</mat-label>
        <input matInput formControlName="priority">
      </mat-form-field>

      <!-- DATE -->
      <mat-form-field appearance="outline" class="full-width" @fieldAnimation>
        <mat-label>Resolved At</mat-label>
        <input
          matInput
          type="date"
          formControlName="resolvedAt"
          [disabled]="form.get('status')?.value === 'Unresolved'">
      </mat-form-field>

      <div class="button-row">


        <button mat-stroked-button type="button" (click)="back()" @fieldAnimation>
          Back
        </button>
        
        <button mat-raised-button color="primary" type="submit" @fieldAnimation>
          Save
        </button>

      </div>

    </form>
  </mat-card>

</div>
