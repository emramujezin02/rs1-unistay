<div class="verify-container">

  <mat-card>

    <h3>Enter verification code</h3>

    <p class="info-text">
      We sent a code to your registered email.
    </p>

    <form [formGroup]="form" (ngSubmit)="verify()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>6-digit code or backup code</mat-label>
        <input matInput
               formControlName="code"
               maxlength="20"
               autocomplete="one-time-code">
        <mat-error *ngIf="form.get('code')?.hasError('required') && form.get('code')?.touched">Code is required.</mat-error>
        <mat-error *ngIf="form.get('code')?.hasError('minlength') && form.get('code')?.touched">Code must be at least 4 characters.</mat-error>
        <mat-error *ngIf="form.get('code')?.hasError('maxlength') && form.get('code')?.touched">Code cannot exceed 100 characters.</mat-error>
      </mat-form-field>

      <div class="button-group">

        <button mat-raised-button
                color="primary"
                type="submit">
          Verify
        </button>

        <button mat-stroked-button
                color="accent"
                type="button"
                (click)="resend()">
          Resend
        </button>

      </div>
    </form>

  </mat-card>

</div>
