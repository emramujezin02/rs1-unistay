<div class="recovery-container">

  <mat-card>

    <!-- STEP 1 -->
    <div *ngIf="step===1">

  <h3>Password recovery</h3>

  <mat-form-field appearance="outline">

    <mat-label>Email</mat-label>

    <input
      matInput
      type="email"
      [(ngModel)]="email"
      #em
      [matAutocomplete]="auto">

    <mat-autocomplete #auto="matAutocomplete">

      <mat-option
        *ngFor="let mail of rememberedEmails"
        [value]="mail">

        {{ mail }}

      </mat-option>

    </mat-autocomplete>

  </mat-form-field>

  <div class="button-group">

    <button
      mat-raised-button
      color="primary"
      (click)="start(em.value)">
      Continue with security questions
    </button>

    <button
      mat-stroked-button
      color="accent"
      (click)="sendViaEmail()">
      Send email token
    </button>

  </div>

</div>

    <!-- STEP 2 -->
    <div *ngIf="step===2">

      <h3>Answer security questions</h3>

      <form [formGroup]="answersForm" (ngSubmit)="submitAnswers()">

        <div *ngFor="let q of questions">

          <mat-form-field appearance="outline">
            <mat-label>{{ getQuestionText(q) }}</mat-label>
            <input matInput [formControlName]="'q' + getQuestionId(q)">
          </mat-form-field>

        </div>

        <button mat-raised-button color="primary" type="submit">
          Verify
        </button>

      </form>

    </div>

    <!-- STEP 3 -->
    <div *ngIf="step===3">

      <h3>Enter new password</h3>

      <form [formGroup]="resetForm" (ngSubmit)="resetPassword()">

        <mat-form-field appearance="outline">
          <mat-label>Token</mat-label>
          <input matInput formControlName="token">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>New password</mat-label>
          <input matInput type="password" formControlName="newPassword">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Confirm password</mat-label>
          <input matInput type="password" formControlName="confirm">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit">
          Reset password
        </button>

      </form>

    </div>

  </mat-card>

</div>
