<div class="recovery-container">

  <mat-card class="recovery-card">

    <!-- STEP 1 -->
    <div class="recovery-step" *ngIf="step===1">

  <h3>Password recovery</h3>

  <form [formGroup]="emailForm" class="recovery-form">

  <mat-form-field appearance="outline" class="full-width">

    <mat-label>Email</mat-label>

    <input
      matInput
      type="email"
      formControlName="email"
      [matAutocomplete]="auto">

    <mat-error *ngIf="emailForm.get('email')?.hasError('required') && emailForm.get('email')?.touched">Email is required.</mat-error>
    <mat-error *ngIf="emailForm.get('email')?.hasError('email') && emailForm.get('email')?.touched">Enter a valid email address.</mat-error>

    <mat-autocomplete #auto="matAutocomplete" class="recovery-autocomplete-panel">

      <mat-option
        *ngFor="let mail of rememberedEmails"
        [value]="mail">

        {{ mail }}

      </mat-option>

    </mat-autocomplete>

  </mat-form-field>

  <div class="button-group">

    <button
      mat-raised-button
      color="primary"
      class="primary-action"
      type="button"
      (click)="start()">
      Continue with security questions
    </button>

    <button
      mat-stroked-button
      color="accent"
      class="secondary-action"
      type="button"
      (click)="sendViaEmail()">
      Send email token
    </button>

  </div>

  </form>

</div>

    <!-- STEP 2 -->
    <div class="recovery-step" *ngIf="step===2">

      <h3>Answer security questions</h3>

      <form [formGroup]="answersForm" (ngSubmit)="submitAnswers()" class="recovery-form">

        <div *ngFor="let q of questions">

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>{{ getQuestionText(q) }}</mat-label>
            <input matInput [formControlName]="'q' + getQuestionId(q)">
          </mat-form-field>

        </div>

        <button mat-raised-button color="primary" type="submit" class="primary-action full-action">
          Verify
        </button>

      </form>

    </div>

    <!-- STEP 3 -->
    <div class="recovery-step" *ngIf="step===3">

      <h3>Enter new password</h3>

      <form [formGroup]="resetForm" (ngSubmit)="resetPassword()" class="recovery-form">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Token</mat-label>
          <input matInput formControlName="token">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New password</mat-label>
          <input matInput type="password" formControlName="newPassword">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm password</mat-label>
          <input matInput type="password" formControlName="confirm">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="primary-action full-action">
          Reset password
        </button>

      </form>

    </div>

  </mat-card>

</div>
