<div class="equipment-container">

  <mat-card @formAnimation >

    <h2>{{ isEdit ? 'Edit Equipment' : 'Add Equipment' }}</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-grid">

        <mat-form-field appearance="outline" @fieldAnimation>
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" [matAutocomplete]="auto">
          <mat-autocomplete
            #auto="matAutocomplete"
            class="equipment-add-autocomplete-panel"
            (optionSelected)="onNameSelected($event.option.value)"
          >
          <mat-option *ngFor="let option of nameSuggestions" [value]="option.name"> {{option.name}}</mat-option>
        </mat-autocomplete>
        </mat-form-field>

        <mat-form-field appearance="outline" @fieldAnimation>
          <mat-label>Type</mat-label>
          <input matInput formControlName="equipmentType" [matAutocomplete]="autoType">
          <mat-autocomplete
            #autoType="matAutocomplete"
            class="equipment-add-autocomplete-panel"
            (optionSelected)="onTypeSelected($event.option.value)"
          >
          <mat-option *ngFor="let option of typeSuggestions" [value]="option.equipmentType">{{option.equipmentType}}</mat-option>
        </mat-autocomplete>
        </mat-form-field>

        <mat-form-field appearance="outline" @fieldAnimation>
          <mat-label>Quantity</mat-label>
          <input matInput type="number" formControlName="quantity">
        </mat-form-field>

        <mat-form-field appearance="outline" @fieldAnimation>
          <mat-label>Available Quantity</mat-label>
          <input matInput type="number" formControlName="availableQuantity">
        </mat-form-field>

        <mat-form-field appearance="outline" class="rental-price-field" @fieldAnimation>
          <mat-label>Rental Price</mat-label>
          <input matInput formControlName="rentalPrice">
        </mat-form-field>

      </div>

      <mat-form-field appearance="outline" class="full-width" @fieldAnimation>
        <mat-label>Description</mat-label>
        <textarea matInput rows="3" formControlName="description"></textarea>
      </mat-form-field>

      <div class="button-row">
        <button mat-stroked-button type="button" class="close-btn" (click)="back()" @fieldAnimation>
          Close
        </button>

        <button mat-raised-button color="primary" type="submit" class="submit-btn" @fieldAnimation>
          {{ isEdit ? 'Save' : 'Add' }}
        </button>
      </div>

    </form>

  </mat-card>

</div>
