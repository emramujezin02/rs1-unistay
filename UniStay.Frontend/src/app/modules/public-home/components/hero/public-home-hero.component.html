<section id="hero" class="hero">
  <img src="/images/college-dormitory.avif" alt="" class="hero__image">
  <div class="hero__overlay"></div>
  <div class="hero__content">
    <span class="hero__eyebrow">Student accommodation management</span>
    <h1>Welcome to UniStay</h1>
    <p>Applications, rooms, announcements, maintenance, and student housing workflows in one calm place.</p>
    <div class="hero__actions">
      <button mat-flat-button color="primary" routerLink="/rooms">Explore rooms</button>
      <button mat-stroked-button type="button" (click)="scrollToFeatures()">View features</button>
    </div>
  </div>
</section>
